name: Publish release

on:
  workflow_dispatch:

jobs:
  call_workflow:
    name: Run Release Workflow
    if: ${{ github.repository_owner == 'ballerina-platform' }}
    uses: ballerina-platform/ballerina-library/.github/workflows/release-package-template.yml@main
    secrets:
      BALLERINA_BOT_EMAIL: ${{ secrets.BALLERINA_BOT_EMAIL }}
      BALLERINA_BOT_TOKEN: ${{ secrets.BALLERINA_BOT_TOKEN }}
      BALLERINA_BOT_USERNAME: ${{ secrets.BALLERINA_BOT_USERNAME }}
      BALLERINA_CENTRAL_ACCESS_TOKEN: ${{ secrets.BALLERINA_CENTRAL_ACCESS_TOKEN }}
    with:
      package-name: tool_discover
      package-org: ballerina
